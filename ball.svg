<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="ballGradient" cx="35%" cy="35%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.8" />
      <stop offset="50%" style="stop-color:#ffffff;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:0.4" />
    </radialGradient>
    <radialGradient id="highlight" cx="30%" cy="30%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.9" />
      <stop offset="40%" style="stop-color:#ffffff;stop-opacity:0" />
    </radialGradient>
  </defs>
  
  <!-- Main ball (white) -->
  <circle cx="100" cy="100" r="95" fill="#f5f5f5" />
  <circle cx="100" cy="100" r="95" fill="url(#ballGradient)" />
  
  <!-- Highlight -->
  <ellipse cx="75" cy="75" rx="35" ry="30" fill="url(#highlight)" />
  
  <!-- Shadow -->
  <ellipse cx="100" cy="160" rx="80" ry="15" fill="#000000" opacity="0.3" />
</svg>
