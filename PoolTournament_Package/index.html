<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pool Tournament</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: url('images/table.jpg') center center / cover no-repeat fixed;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }
        
        body::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            pointer-events: none;
            z-index: 0;
        }

        /* Pool balls floating in background */
        .pool-ball {
            position: fixed;
            opacity: 1;
            z-index: 1;
            filter: drop-shadow(0 5px 10px rgba(0, 0, 0, 0.3));
            border-radius: 50%;
            object-fit: cover;
            pointer-events: none;
        }

        .ball-1 { width: 53px; height: 53px; }
        .ball-2 { width: 53px; height: 53px; }
        .ball-3 { width: 53px; height: 53px; }
        .ball-4 { width: 53px; height: 53px; }
        .ball-5 { width: 53px; height: 53px; }
        .ball-6 { width: 53px; height: 53px; }
        .ball-7 { width: 53px; height: 53px; }
        .ball-8 { width: 53px; height: 53px; }

        .container {
            position: relative;
            z-index: 2;
            text-align: center;
        }



        .button-container {
            display: flex;
            flex-direction: column;
            gap: 25px;
            align-items: center;
        }

        .menu-btn {
            width: 300px;
            padding: 20px 40px;
            font-size: 28px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
            border: 4px solid;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }

        .btn-play {
            background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
            color: #000;
            border-color: #FFD700;
            box-shadow: 
                0 0 30px rgba(255, 215, 0, 0.8),
                0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .btn-play:hover {
            transform: scale(1.1);
            box-shadow: 
                0 0 50px rgba(255, 215, 0, 1),
                0 15px 40px rgba(0, 0, 0, 0.6);
        }

        .btn-register {
            background: linear-gradient(135deg, #FF1493 0%, #FF69B4 100%);
            color: #fff;
            border-color: #FF1493;
            box-shadow: 
                0 0 30px rgba(255, 20, 147, 0.8),
                0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .btn-register:hover {
            transform: scale(1.1);
            box-shadow: 
                0 0 50px rgba(255, 20, 147, 1),
                0 15px 40px rgba(0, 0, 0, 0.6);
        }

        .btn-list {
            background: linear-gradient(135deg, #4169E1 0%, #1E90FF 100%);
            color: #fff;
            border-color: #4169E1;
            box-shadow: 
                0 0 30px rgba(65, 105, 225, 0.8),
                0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .btn-list:hover {
            transform: scale(1.1);
            box-shadow: 
                0 0 50px rgba(65, 105, 225, 1),
                0 15px 40px rgba(0, 0, 0, 0.6);
        }

        .menu-btn:active {
            transform: scale(1.05);
        }

        @media (max-width: 768px) {
            .menu-btn {
                width: 250px;
                font-size: 22px;
                padding: 15px 30px;
            }
        }
    </style>
</head>
<body>
    <!-- Pool balls decoration -->
    <img src="images/Black and Blue Modern Game Night YouTube Thumbnail.png" class="pool-ball ball-1" alt="">
    <img src="images/Black and Blue Modern Game Night YouTube Thumbnail (1).png" class="pool-ball ball-2" alt="">
    <img src="images/Black and Blue Modern Game Night YouTube Thumbnail (2).png" class="pool-ball ball-3" alt="">
    <img src="images/Black and Blue Modern Game Night YouTube Thumbnail (3).png" class="pool-ball ball-4" alt="">
    <img src="images/Black and Blue Modern Game Night YouTube Thumbnail (4).png" class="pool-ball ball-5" alt="">
    <img src="images/Black and Blue Modern Game Night YouTube Thumbnail (5).png" class="pool-ball ball-6" alt="">
    <img src="images/Black and Blue Modern Game Night YouTube Thumbnail (8).png" class="pool-ball ball-7" alt="">
    <img src="images/Black and Blue Modern Game Night YouTube Thumbnail (9).png" class="pool-ball ball-8" alt="">
    
    <div class="container">
        <div class="button-container">
            <a href="tournament.html" class="menu-btn btn-register">Tournament</a>
            <a href="register.html" class="menu-btn btn-list">Register</a>
            <a href="players.html" class="menu-btn btn-list">List Players</a>
        </div>
    </div>

    <script src="matchup.js"></script>
    <script>
        // Initialize ball physics on home screen too
        document.addEventListener('DOMContentLoaded', () => {
            initBallPhysics();
        });
    </script>
</body>
</html>
