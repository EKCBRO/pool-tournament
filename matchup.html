<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Player Matchup</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: url('images/table.jpg') center center / cover no-repeat fixed;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }
        
        body::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.3);
            pointer-events: none;
            z-index: 0;
        }

        /* Pool balls floating in background */
        body::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .pool-ball {
            position: fixed;
            opacity: 1;
            z-index: 1;
            filter: drop-shadow(0 5px 10px rgba(0, 0, 0, 0.3));
            border-radius: 50%;
            object-fit: cover;
            pointer-events: none;
        }

        .ball-1 { width: 53px; height: 53px; }
        .ball-2 { width: 53px; height: 53px; }
        .ball-3 { width: 53px; height: 53px; }
        .ball-4 { width: 53px; height: 53px; }
        .ball-5 { width: 53px; height: 53px; }
        .ball-6 { width: 53px; height: 53px; }
        .ball-9 { width: 53px; height: 53px; }
        .ball-10 { width: 53px; height: 53px; }

        .container {
            width: 100%;
            height: 100vh;
            position: relative;
            z-index: 1;
        }

        .control-panel {
            display: none;
        }

        .matchup-container {
            width: 100%;
            height: 100vh;
            display: flex;
            position: relative;
            overflow: visible;
        }

        .player {
            width: 50%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            padding: 40px;
            animation: fadeIn 0.8s ease-in;
            z-index: 10;
        }

        #player1 {
            background: radial-gradient(ellipse at center, rgba(139, 0, 0, 0.4) 0%, transparent 70%);
        }

        #player2 {
            background: radial-gradient(ellipse at center, rgba(75, 0, 130, 0.4) 0%, transparent 70%);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.95);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .player-image {
            width: 280px;
            height: 280px;
            border-radius: 50%;
            object-fit: cover;
            border: 8px solid #FF1493;
            margin-bottom: 30px;
            box-shadow: 
                0 0 30px rgba(255, 215, 0, 0.5),
                0 15px 40px rgba(0, 0, 0, 0.6);
            transition: transform 0.3s, box-shadow 0.3s;
            cursor: pointer;
        }

        .player:hover .player-image {
            transform: scale(1.08);
            box-shadow: 
                0 0 50px rgba(255, 215, 0, 0.7),
                0 20px 50px rgba(0, 0, 0, 0.7);
        }

        .player-name {
            font-size: 48px;
            font-weight: 900;
            color: #FFFFFF;
            margin-bottom: 30px;
            text-transform: uppercase;
            letter-spacing: 2px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            max-width: 500px;
            overflow-wrap: break-word;
            word-break: break-word;
            line-height: 1.2;
        }
        
        #player1 .player-name {
            text-shadow: 
                2px 2px 4px rgba(0, 0, 0, 0.7),
                0 0 30px rgba(139, 0, 0, 0.8),
                0 0 60px rgba(139, 0, 0, 0.5);
        }
        
        #player2 .player-name {
            text-shadow: 
                2px 2px 4px rgba(0, 0, 0, 0.7),
                0 0 30px rgba(75, 0, 130, 0.8),
                0 0 60px rgba(75, 0, 130, 0.5);
        }

        @keyframes vsPulse {
            0%, 100% { transform: translate(-50%, -50%) scale(1); }
            50% { transform: translate(-50%, -50%) scale(1.1); }
        }



        .error {
            position: fixed;
            bottom: 60px;
            right: 10px;
            color: #ff6b6b;
            font-weight: 600;
            font-size: 12px;
            background: rgba(0, 0, 0, 0.8);
            padding: 8px 12px;
            border-radius: 4px;
            z-index: 1001;
        }

        /* Winner mode styles */
        .hidden {
            display: none !important;
            visibility: hidden !important;
            opacity: 0 !important;
        }

        body.winner-mode .matchup-container {
            justify-content: center;
            align-items: center;
        }

        body.winner-mode .player {
            width: 100% !important;
            justify-content: center !important;
            align-items: center !important;
            background: transparent !important;
            transition: all 0.5s ease;
        }

        body.winner-mode .player-image {
            width: 400px !important;
            height: 400px !important;
            animation: profilePulse 2s ease-in-out infinite !important;
        }
        
        @keyframes profilePulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        
        body.winner-mode .player-name {
            display: block !important;
            max-width: 90vw;
            padding: 0 20px;
        }

        .winner-text {
            display: none !important;
            position: fixed !important;
            top: 15% !important;
            left: 50% !important;
            transform: translateX(-50%) !important;
            font-size: 120px !important;
            font-weight: 900 !important;
            color: #FF1493 !important;
            text-shadow: 
                0 0 40px rgba(255, 20, 147, 1),
                0 0 80px rgba(255, 20, 147, 0.8),
                4px 4px 8px rgba(0, 0, 0, 1) !important;
            letter-spacing: 20px !important;
            z-index: 10000 !important;
            pointer-events: none !important;
            -webkit-text-stroke: 3px black !important;
            animation: winnerPulse 2s ease-in-out infinite !important;
        }

        body.winner-mode .winner-text {
            display: block !important;
        }

        @keyframes winnerPulse {
            0%, 100% { transform: translateX(-50%) scale(1); }
            50% { transform: translateX(-50%) scale(1.1); }
        }

        .sparkle {
            position: fixed;
            width: 35px;
            height: 35px;
            background: #FF1493;
            clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
            pointer-events: none;
            z-index: 10001;
            display: none;
        }

        body.winner-mode .sparkle {
            display: block;
            animation: sparkleFloat 3s ease-in-out infinite;
        }

        .next-match-btn {
            display: none;
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            padding: 6px 12px;
            font-size: 14px;
            font-weight: 700;
            background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
            color: #000;
            border: 2px solid #FFD700;
            border-radius: 6px;
            cursor: pointer;
            z-index: 10002;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 
                0 0 15px rgba(255, 215, 0, 0.6),
                0 4px 10px rgba(0, 0, 0, 0.4);
            transition: all 0.3s ease;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.3);
        }

        .next-match-btn:hover {
            transform: translateX(-50%) scale(1.05);
            box-shadow: 
                0 0 25px rgba(255, 215, 0, 0.8),
                0 6px 15px rgba(0, 0, 0, 0.5);
            background: linear-gradient(135deg, #FFF700 0%, #FFB500 100%);
        }

        .next-match-btn:active {
            transform: translateX(-50%) scale(0.98);
        }

        body.winner-mode .next-match-btn {
            display: block;
        }

        .register-btn {
            position: fixed;
            top: 30px;
            right: 30px;
            padding: 8px 16px;
            font-size: 14px;
            font-weight: 700;
            background: linear-gradient(135deg, #FF1493 0%, #FF69B4 100%);
            color: #fff;
            border: 2px solid #FF1493;
            border-radius: 6px;
            cursor: pointer;
            z-index: 10002;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 
                0 0 15px rgba(255, 20, 147, 0.6),
                0 4px 10px rgba(0, 0, 0, 0.4);
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);
        }

        .register-btn:hover {
            transform: scale(1.05);
            box-shadow: 
                0 0 25px rgba(255, 20, 147, 0.8),
                0 6px 15px rgba(0, 0, 0, 0.5);
            background: linear-gradient(135deg, #FF1493 0%, #FF85C1 100%);
        }

        body.winner-mode .register-btn {
            display: none;
        }

        .home-btn {
            position: fixed;
            top: 30px;
            left: 30px;
            padding: 8px 16px;
            font-size: 14px;
            font-weight: 700;
            background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
            color: #000;
            border: 2px solid #FFD700;
            border-radius: 6px;
            cursor: pointer;
            z-index: 10002;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 
                0 0 15px rgba(255, 215, 0, 0.6),
                0 4px 10px rgba(0, 0, 0, 0.4);
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.3);
        }

        .home-btn:hover {
            transform: scale(1.05);
            box-shadow: 
                0 0 25px rgba(255, 215, 0, 0.8),
                0 6px 15px rgba(0, 0, 0, 0.5);
        }

        body.winner-mode .home-btn {
            display: none;
        }
        
        .register-btn {
            display: none;
        }

        @keyframes vsPulse {
            0%, 100% { transform: translate(-50%, -50%) scale(1); }
            50% { transform: translate(-50%, -50%) scale(1.1); }
        }

        .title-text {
            position: fixed !important;
            top: 53px !important;
            left: 50% !important;
            transform: translateX(-50%) !important;
            font-size: 60px !important;
            font-weight: 900 !important;
            color: #FF1493 !important;
            text-shadow: 
                0 0 30px rgba(255, 20, 147, 1),
                0 0 60px rgba(255, 20, 147, 0.8),
                3px 3px 6px rgba(0, 0, 0, 1) !important;
            letter-spacing: 8px !important;
            z-index: 10000 !important;
            pointer-events: none !important;
            -webkit-text-stroke: 2px black !important;
            text-transform: uppercase !important;
        }

        @keyframes sparkleFloat {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-100px) rotate(360deg); opacity: 0; }
        }

        @media (max-width: 768px) {
            .matchup-container {
                flex-direction: column;
            }

            #player1, #player2 {
                width: 100%;
                height: 50%;
            }

            .player-image {
                width: 180px;
                height: 180px;
            }

            .player-name {
                font-size: 32px;
            }
        }
    </style>
</head>
<body>
    <!-- Pool balls decoration -->
    <img src="images/Black and Blue Modern Game Night YouTube Thumbnail.png" class="pool-ball ball-1" alt="">
    <img src="images/Black and Blue Modern Game Night YouTube Thumbnail (1).png" class="pool-ball ball-2" alt="">
    <img src="images/Black and Blue Modern Game Night YouTube Thumbnail (2).png" class="pool-ball ball-3" alt="">
    <img src="images/Black and Blue Modern Game Night YouTube Thumbnail (3).png" class="pool-ball ball-4" alt="">
    <img src="images/Black and Blue Modern Game Night YouTube Thumbnail (4).png" class="pool-ball ball-5" alt="">
    <img src="images/Black and Blue Modern Game Night YouTube Thumbnail (5).png" class="pool-ball ball-6" alt="">
    <img src="images/Black and Blue Modern Game Night YouTube Thumbnail (8).png" class="pool-ball ball-9" alt="">
    <img src="images/Black and Blue Modern Game Night YouTube Thumbnail (9).png" class="pool-ball ball-10" alt="">
    
    <div class="container">
        <div class="matchup-container" id="matchupDisplay">
            <div class="player" id="player1">
                <img src="https://via.placeholder.com/280" alt="Player 1" class="player-image" id="player1Image" onclick="toggleWinner(1)" onerror="this.src='https://via.placeholder.com/280'">
                <div class="player-name" id="player1Name">Loading...</div>
            </div>

            <div class="player" id="player2">
                <img src="https://via.placeholder.com/280" alt="Player 2" class="player-image" id="player2Image" onclick="toggleWinner(2)" onerror="this.src='https://via.placeholder.com/280'">
                <div class="player-name" id="player2Name">Loading...</div>
            </div>

        </div>
    </div>

    <div id="vsText" style="position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 9999; font-size: 150px; font-weight: 900; color: #FF1493; text-shadow: 0 0 40px rgba(255, 20, 147, 1), 0 0 80px rgba(255, 20, 147, 0.8), 4px 4px 8px rgba(0, 0, 0, 1); letter-spacing: 20px; pointer-events: none; -webkit-text-stroke: 3px black; animation: vsPulse 1.5s ease-in-out infinite;">VS</div>

    <a href="index.html" class="home-btn">← Home</a>

    <div class="control-panel">
        <h2>Match Control</h2>
        <div class="input-group">
            <label for="player1Input">P1:</label>
            <input type="number" id="player1Input" min="1" value="1">
            <label for="player2Input">P2:</label>
            <input type="number" id="player2Input" min="1" value="2">
            <button onclick="updateMatchup()">Update</button>
        </div>
    </div>
    <div id="errorMessage" class="error"></div>

    <div id="winnerText" style="display: none; position: fixed; bottom: 15%; left: 50%; transform: translateX(-50%); font-size: 120px; font-weight: 900; color: #FF1493; text-shadow: 0 0 40px rgba(255, 20, 147, 1), 0 0 80px rgba(255, 20, 147, 0.8), 4px 4px 8px rgba(0, 0, 0, 1); letter-spacing: 20px; z-index: 10000; pointer-events: none; -webkit-text-stroke: 3px black; animation: winnerPulse 2s ease-in-out infinite;">WINNER</div>
    
    <button class="next-match-btn" onclick="toggleWinner()">Next Match</button>
    
    <!-- Sparkles -->
    <div class="sparkle" style="left: 20%; top: 30%; animation-delay: 0s;"></div>
    <div class="sparkle" style="left: 80%; top: 25%; animation-delay: 0.5s;"></div>
    <div class="sparkle" style="left: 15%; top: 60%; animation-delay: 1s;"></div>
    <div class="sparkle" style="left: 85%; top: 65%; animation-delay: 1.5s;"></div>
    <div class="sparkle" style="left: 50%; top: 20%; animation-delay: 2s;"></div>
    <div class="sparkle" style="left: 30%; top: 75%; animation-delay: 2.5s;"></div>
    <div class="sparkle" style="left: 70%; top: 70%; animation-delay: 0.7s;"></div>
    <div class="sparkle" style="left: 25%; top: 40%; animation-delay: 1.3s;"></div>
    <div class="sparkle" style="left: 75%; top: 45%; animation-delay: 1.8s;"></div>
    <div class="sparkle" style="left: 45%; top: 80%; animation-delay: 2.3s;"></div>
    <div class="sparkle" style="left: 10%; top: 50%; animation-delay: 0.3s;"></div>
    <div class="sparkle" style="left: 90%; top: 55%; animation-delay: 1.1s;"></div>
    <div class="sparkle" style="left: 35%; top: 15%; animation-delay: 1.6s;"></div>
    <div class="sparkle" style="left: 65%; top: 85%; animation-delay: 2.1s;"></div>
    <div class="sparkle" style="left: 50%; top: 90%; animation-delay: 0.9s;"></div>
    <div class="sparkle" style="left: 18%; top: 20%; animation-delay: 1.4s;"></div>
    <div class="sparkle" style="left: 82%; top: 35%; animation-delay: 1.9s;"></div>
    <div class="sparkle" style="left: 40%; top: 55%; animation-delay: 0.4s;"></div>
    <div class="sparkle" style="left: 60%; top: 50%; animation-delay: 2.4s;"></div>
    <div class="sparkle" style="left: 55%; top: 65%; animation-delay: 1.2s;"></div>

    <script src="matchup.js"></script>
</body>
</html>
